services:
  - type: web
    name: erpacc
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'python wait_for_db.py && gunicorn --bind 0.0.0.0:$PORT wsgi:application'
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: FLASK_ENV
        value: production
      # Set these secrets in the Render service environment.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SHOP_CORS_ORIGINS
        value: https://webshop-f9iq.onrender.com
      - key: SHOP_BACKEND_URL
        value: https://erpacc-i7uy.onrender.com

  - type: web
    name: webshop
    runtime: node
    rootDir: webshop
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ERPACC_BACKEND_URL
        value: https://erpacc-i7uy.onrender.com
